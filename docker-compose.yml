# Smart Building Monitoring — SHARED file: any change is made by both team members.
# Start: docker compose up -d     (after copying .env.example to .env)

services:
  # =====================================================================
  # PERSON A — Ingestion & processing
  # =====================================================================
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    restart: unless-stopped

  nodered:
    build: ./nodered
    image: smart-building-nodered
    container_name: nodered
    ports:
      - "${NODERED_PORT:-1880}:1880"
    environment:
      TZ: Europe/Paris
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      KAFKA_BOOTSTRAP: kafka:29092
    volumes:
      - ./nodered/data:/data          # flows.json is versioned in Git
    depends_on:
      - mosquitto
      - kafka
    restart: unless-stopped

  # The simulator will be added here by A (day 3):
  # simulator:
  #   build: ./simulator
  #   environment:
  #     MQTT_HOST: mosquitto
  #   depends_on: [mosquitto]

  # =====================================================================
  # PERSON B — Streaming & analytics
  # =====================================================================
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot service: creates the topics from the interface contract, then exits.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:29092
    volumes:
      - ./kafka:/scripts:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smart-building
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "${INFLUX_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: smartbuilding
      DOCKER_INFLUXDB_INIT_BUCKET: building
      DOCKER_INFLUXDB_INIT_RETENTION: 7d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influx-data:/var/lib/influxdb2
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - influxdb
    restart: unless-stopped

  # Fake producer (day 3): contract-compliant test data, only started with
  #   docker compose --profile fake up -d
  fake-producer:
    build:
      context: ./services
      dockerfile: fake-producer/Dockerfile
    container_name: fake-producer
    profiles: ["fake"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      INTERVAL_SECONDS: 2
      ANOMALY_EVERY_SECONDS: 60
      ANOMALY_DURATION_SECONDS: 20
      TZ: Europe/Paris
    volumes:
      - ./simulator/building.json:/app/building.json:ro
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  storage-consumer:
    build:
      context: ./services
      dockerfile: storage-consumer/Dockerfile
    container_name: storage-consumer
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      GROUP_ID: storage
      SUMMARY_SECONDS: 10
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: smartbuilding
      INFLUX_BUCKET: building
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_started
    restart: unless-stopped

  # Aggregator (day 6): 1-minute windows per room + sensorType -> building.aggregates
  aggregator:
    build:
      context: ./services
      dockerfile: aggregator/Dockerfile
    container_name: aggregator
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      GROUP_ID: aggregator
      WINDOW_SECONDS: 60
      ALLOWED_LATENESS_SECONDS: 5
      IDLE_SECONDS: 10
      SUMMARY_SECONDS: 30
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Notifier (day 8): building.alerts -> Telegram (DRY-RUN if the bot is not configured)
  notifier:
    build:
      context: ./services
      dockerfile: notifier/Dockerfile
    container_name: notifier
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      GROUP_ID: notifier
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      MAX_AGE_SECONDS: 300
      GROUP_THRESHOLD: 3
      TZ: Europe/Paris
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mosquitto-data:
  mosquitto-log:
  kafka-data:
  influx-data:
  grafana-data:
